# at 0x8259A860-0x8259A874), stores the category (stb r11,0x770(r3)) and
# switches on category-1 through the bdzf chain 0x8259A8A0-0x8259A8B4: the
# fifth bdzf (r11 = 5, category 6 = eREVERSAL of
# SD_AnimStateConcreteAttack.EAttackCategories) branches to 0x8259A9DC, which
# bumps the reversal counter (lwz r11,0x19b0(r3) / +0xBC) read by
# GetSuccessRate_Reversals. r3 there is the reversing pawn, already cast.
# Void: the counter still counts.
[[entrypoint.midasm_hook]]
address = 0x8259A9DC
name = "WweReversal"
registers = ["r1", "r13", "fpscr", "r3"]

# Full-coverage vibration finisher wind-up (.scratch/full-coverage-vibration/,
# ticket 05; evidence in docs/research/impact-events.md section D). Attack-state
# enter 0x824E3318 (state r3 -> r23, pawn cast to r29 at 0x824E3348) copies
# the state's combat type (lbz r8,0x43(r23) / stb r8,0x76d(r29) at
# 0x824E33A4-0x824E33B0). Type 5 (FINISHER) bumps stat 0x1F (bl 0x82b059c0 at
# 0x824E33D8) and branches here (b 0x824e33e8); type 15 (EXTREME_SIGNATURE)
# falls through (cmplwi cr6,r11,0xf / bne 0x824e33f4 at 0x824E33E0). Every
# other type skips 0x824E33E8 (li r4,0). r23 and r29 are non-volatile; r8 is
# clobbered by that bl, so the hook reads the type from r23+0x43. Void.
[[entrypoint.midasm_hook]]
address = 0x824E33E8
name = "WweWindUp"
registers = ["r1", "r13", "fpscr", "r23", "r29"]

# Full-coverage vibration match end (.scratch/full-coverage-vibration/, ticket
# 06; evidence in docs/research/impact-events.md section E). AttemptMatchEnd
# 0x82AEA6E8 (manager r3 -> r21, pawn r4 -> r28, win type r5 -> r22) sets the
# winner r23 = GetTargetPawn(r28, 5), r28's last attacker, in its win cases;
# failed attempts return 0 at 0x82AEAE18 (li r3,0). 0x82AEAE28 (stw
# r23,0x130(r21)) is the only path returning 1 (li r3,1 at 0x82AEAE2C): the
# match is won, r23 the winner, r28 the loser. f31 is stored next
# (stfs f31,0x134(r21)); the hook restores its side call's fpscr. Void.
[[entrypoint.midasm_hook]]
address = 0x82AEAE28
name = "WweMatchEnd"
registers = ["r1", "r13", "fpscr", "r23", "r28"]

# Full-coverage vibration camera-shake impacts (.scratch/full-coverage-vibration/,
