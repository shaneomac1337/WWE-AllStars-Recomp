[[entrypoint.midasm_hook]]
address = 0x825A5020
name = "WweCameraShake"
registers = ["r1", "r13", "fpscr", "r3", "r4"]

# Low-end preset GPU-wait back-off (.scratch/low-end-preset/, ticket 11; evidence in
# docs/research/spin-loops.md section 2). D3D's six GPU-wait loops each call 0x82DB90A0
# (begin: stw r4,0(r3) device, stw r5,4(r3) reason, read pointer, time), then loop
# { addi r3,r1,<record>; bl 0x82db91b0; cmpwi r3,0; beq <exit>; <test>; branch back to
# the addi }, then bl 0x82db90d0 (end). 0x82DB91B0 is the spin step (32 priority-hint
# no-ops, the 0x2ABD lost bit, a 5000 ms hang check) and is never hooked. Each hook
# site is the cmpwi r3,0 right after its bl 0x82db91b0; no branch targets it (each
# loop branches back to its addi). Void, no registers: the hook only waits on the host;
# r3 and the loop's test run as shipped.
# 0x82DB7058: ring space, loop 0x82DB70A8-0x82DB70DC (read pointer +4 of device+0x2A90).
[[entrypoint.midasm_hook]]
address = 0x82DB70B0
