# Enhanced vibration (.scratch/enhanced-vibration/spec.md; evidence in
# docs/research/controller-vibration.md). Hooks, not seeds: no function is added.
# Pawn damage function 0x82AE58C0, at its aerial check. 0x82AE63B8-0x82AE63D0
# call vtable+0x2D0 on the victim and branch to 0x82AE6400 when it returns
# non-zero, so only hits past the game's own possession check reach 0x82AE63D4
# (lbz r11,0x18(r29) / cmplwi cr6,r11,4). Live there: r28 victim pawn, r29
# damage record (+0x18 combat type), r1/r13 the guest stack and thread
# pointers (since full-coverage vibration the hook adds a rumble-mixer effect
# and calls no guest function; docs/adr/0017). True (Enhanced) skips the game's
# aerial call to 0x82AE6400 (lwz r10,0x854(r27)), the next block, which
# needs no register the skipped code sets.
[[entrypoint.midasm_hook]]
address = 0x82AE63D4
name = "WweHitPulse"
registers = ["r1", "r13", "fpscr", "r28", "r29"]
jump_address_on_true = 0x82AE6400

# Full-coverage vibration attacker confirm (.scratch/full-coverage-vibration/,
# ticket 03), same function, before the possession gate: 0x82AE63B8 (lwz
# r11,0(r28)) follows bl 0x82ae2b10 and starts the vtable+0x2D0 call whose
# non-zero result (an AI-possessed victim) branches past 0x82AE63D4 to
# 0x82AE6400 (bne cr6,0x82ae6400 at 0x82AE63D0). So the WweHitPulse site never
# sees a hit on the AI's wrestler, the hit a human attacker lands most. r28
# (victim) and r29 (damage record, +0x18 combat type) are non-volatile and
# not written between here and 0x82AE63D4. The victim's +0x95C is this hit's
# attacker (docs/research/controller-vibration.md, ticket 01 section 3).
# Void: the gate runs as shipped.
[[entrypoint.midasm_hook]]
address = 0x82AE63B8
name = "WweAttackerConfirm"
registers = ["r1", "r13", "fpscr", "r28", "r29"]

# Critical-health double pulse, same function. 0x82AE6450-0x82AE6460: health on
# entry (f27, from vtable+0x3DC at 0x82AE58E4) must be above the threshold
# (lfs f0,0x158(r3) of 0x82AF5908's result) or ble 0x82ae64d4 skips;
# 0x82AE6464-0x82AE6498: health now (vtable+0x3DC again) must not be above it
# or bgt 0x82ae64d4 skips. 0x82AE649C (lis r11,-0x7de0) then builds
# L"SFX_UI_HUD_CRITICAL_01" (0x821FBFC8, addi r4,r11,-0x4038 at 0x82AE64A4) and
# plays it. So it runs once per crossing. r28 is still the victim pawn (no write
# after 0x82AE58E0). Void: the sound still plays.
[[entrypoint.midasm_hook]]
address = 0x82AE649C
name = "WweCriticalPulse"
registers = ["r1", "r13", "fpscr", "r28"]

