; Edits to Xe-Game.ini, one of the inner inis of Title Update 2's Coalesced.ini. A file
; straight in config/ edits Coalesced.ini; a file in config/int/ (or deu, fra, ita, spa)
; edits that language's Coalesced bundle.
;
; Lines starting with ";" are comments. Each other line under a [Section] is one edit:
;   Key=Value    sets the key (it replaces every value the key had)
;   +Key=Value   adds the value, unless the key already has it
;   -Key=Value   removes that value
;   .Key=Value   adds the value, even if the key already has it
;
; This edit takes the THQ logo out of the startup movies.

[VendorStartup]
-Movies=../Game/Movies/THQ.bik
